[project]
name = "guardian-registry-client"
version = "0.23.0"
description = "Client for banks and payment apps integrating with Guardian Registry"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guardian_registry_client"]
