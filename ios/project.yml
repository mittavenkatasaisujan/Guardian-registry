# XcodeGen spec: `brew install xcodegen && xcodegen` creates GuardianRegistry.xcodeproj.
name: GuardianRegistry
options:
  bundleIdPrefix: in.guardianregistry
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.27.0"
    CURRENT_PROJECT_VERSION: "1"
    # Where the app talks to; override in your scheme or with xcodebuild GR_API_BASE=...
    GR_API_BASE: "https://registry.example.in"
targets:
  GuardianRegistry:
    type: application
    platform: iOS
    sources: [GuardianRegistry]
    entitlements:
      path: GuardianRegistry/GuardianRegistry.entitlements
      properties:
        aps-environment: production
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: GuardianRegistry/Info.plist
      properties:
        CFBundleDisplayName: Guardian Registry
        GRApiBase: $(GR_API_BASE)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # plain http only to the local machine (a dev server in the simulator); everything else HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.guardianregistry.app
        GENERATE_INFOPLIST_FILE: NO
  GuardianRegistryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GuardianRegistryTests]
    dependencies:
      - target: GuardianRegistry
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.guardianregistry.app.tests
  GuardianRegistryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GuardianRegistryUITests]
    dependencies:
      - target: GuardianRegistry
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.guardianregistry.app.uitests
        TEST_TARGET_NAME: GuardianRegistry
schemes:
  GuardianRegistry:
    build:
      targets:
        GuardianRegistry: all
        GuardianRegistryTests: [test]
        GuardianRegistryUITests: [test]
    test:
      targets: [GuardianRegistryTests, GuardianRegistryUITests]
