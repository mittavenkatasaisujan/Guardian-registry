name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server and run the end-to-end demo over HTTP
        env:
          GR_ADMIN_TOKEN: ci-admin
          GR_DB: ci.db
          GR_OTP_DEV_ECHO: "1"
          GR_WORKER_INTERVAL: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          python scripts/demo.py http://127.0.0.1:8000 ci-admin
