name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server and run the end-to-end demo over HTTP
        env:
          GR_OPERATORS: "alice:ci-alice-token,bob:ci-bob-token"
          GR_DB: ci.db
          GR_OTP_DEV_ECHO: "1"
          GR_WORKER_INTERVAL: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          python scripts/demo.py http://127.0.0.1:8000 ci-alice-token ci-bob-token

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full test suite on Postgres (each test in its own schema)
        env:
          GR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q

  demo-postgres:
    runs-on: ubuntu-latest
    needs: test-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Two API nodes on one Postgres, shared rate limits; demo against node A
        env:
          GR_OPERATORS: "alice:ci-alice-token,bob:ci-bob-token"
          GR_DB: postgresql://postgres:postgres@localhost:5432/postgres
          GR_RATE_BACKEND: db
          GR_OTP_DEV_ECHO: "1"
          GR_WORKER_INTERVAL: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 &
          python -m uvicorn guardian_registry.api:create_app --factory --port 8001 &
          for p in 8000 8001; do for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/healthz && break; sleep 1; done; done
          python scripts/demo.py http://127.0.0.1:8000 ci-alice-token ci-bob-token
          echo "node B sees the same audit chain:"
          curl -sf -H "X-Admin-Token: ci-alice-token" http://127.0.0.1:8001/v1/admin/audit/verify | tee /tmp/b.json
          python -c "import json; d=json.load(open('/tmp/b.json')); assert d['ok'] and d['entries'] > 40, d"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the Android app and run its unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift wire self-check (bytes the server must agree with)
        run: |
          swiftc ios/GuardianRegistry/Wire.swift ios/WireCheck/main.swift -o wirecheck
          ./wirecheck | tee wirecheck.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Server agrees with the Swift bytes
        run: |
          pip install -r requirements.txt
          WIRECHECK_OUTPUT=wirecheck.txt python -m pytest -q tests/test_native_contract.py
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Build the iOS app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/GuardianRegistry.xcodeproj -target GuardianRegistry -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Start a registry for the app to talk to
        run: |
          GR_DB=ios-e2e.db python scripts/dev_server.py 8010 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
      - name: Sign in from the app's code in the simulator (Keychain key, signing, server checks)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $SIM"
          xcodebuild test -project ios/GuardianRegistry.xcodeproj -scheme GuardianRegistry \
            -destination "id=$SIM" | tail -60
      - if: failure()
        run: tail -100 server.log || true

  android-e2e:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Start a registry for the emulator to talk to (10.0.2.2:8010)
        run: |
          GR_DB=android-e2e.db python scripts/dev_server.py 8010 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign in from the app's code on an emulator (real Android Keystore)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p android :app:connectedDebugAndroidTest --no-daemon
            adb logcat -d -s GRATTEST:I -v raw > attestation-logcat.txt
      - name: Check the real Keystore attestation with the registry's parser
        run: python scripts/check_attestation.py attestation-logcat.txt
      - if: failure()
        run: tail -100 server.log || true
