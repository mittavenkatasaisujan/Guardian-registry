name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server and run the end-to-end demo over HTTP
        env:
          GR_OPERATORS: "alice:ci-alice-token,bob:ci-bob-token"
          GR_DB: ci.db
          GR_OTP_DEV_ECHO: "1"
          GR_WORKER_INTERVAL: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          python scripts/demo.py http://127.0.0.1:8000 ci-alice-token ci-bob-token

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full test suite on Postgres (each test in its own schema)
        env:
          GR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q

  demo-postgres:
    runs-on: ubuntu-latest
    needs: test-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Two API nodes on one Postgres, shared rate limits; demo against node A
        env:
          GR_OPERATORS: "alice:ci-alice-token,bob:ci-bob-token"
          GR_DB: postgresql://postgres:postgres@localhost:5432/postgres
          GR_RATE_BACKEND: db
          GR_OTP_DEV_ECHO: "1"
          GR_WORKER_INTERVAL: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 &
          python -m uvicorn guardian_registry.api:create_app --factory --port 8001 &
          for p in 8000 8001; do for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/healthz && break; sleep 1; done; done
          python scripts/demo.py http://127.0.0.1:8000 ci-alice-token ci-bob-token
          echo "node B sees the same audit chain:"
          curl -sf -H "X-Admin-Token: ci-alice-token" http://127.0.0.1:8001/v1/admin/audit/verify | tee /tmp/b.json
          python -c "import json; d=json.load(open('/tmp/b.json')); assert d['ok'] and d['entries'] > 40, d"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the Android app and run its unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Keep the debug APK (install it on a test phone)
        uses: actions/upload-artifact@v4
        with:
          name: guardian-registry-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-15-intel   # arm64 macOS runners were repeatedly unavailable (GitHub capacity)
    steps:
      - uses: actions/checkout@v5
      - name: Swift wire self-check (bytes the server must agree with)
        run: |
          swiftc ios/GuardianRegistry/Wire.swift ios/WireCheck/main.swift -o wirecheck
          ./wirecheck | tee wirecheck.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Server agrees with the Swift bytes
        run: |
          pip install -r requirements.txt
          WIRECHECK_OUTPUT=wirecheck.txt python -m pytest -q tests/test_native_contract.py
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen
      - name: Build the iOS app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/GuardianRegistry.xcodeproj -target GuardianRegistry -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Start a registry for the app to talk to
        run: |
          PYTHONUNBUFFERED=1 GR_DB=ios-e2e.db python scripts/dev_server.py 8010 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
      - name: Sign in from the app's code in the simulator (Keychain key, signing, server checks)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $SIM"
          xcodebuild test -project ios/GuardianRegistry.xcodeproj -scheme GuardianRegistry \
            -destination "id=$SIM" | tail -60
      - if: failure()
        run: |
          pkill -USR1 -f dev_server.py || true   # dump every server thread's stack
          sleep 2
          tail -300 server.log || true

  android-e2e:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Start a registry for the emulator to talk to (10.0.2.2:8010)
        run: |
          GR_DB=android-e2e.db GR_RATE_OTP=1000/60 python scripts/dev_server.py 8010 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign-in and every screen on an emulator (real Android Keystore)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p android :app:connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || { adb pull /sdcard/Android/data/in.guardianregistry.app/files/shots app-screens || true; exit 1; }
            adb logcat -d -s GRATTEST:I -v raw > attestation-logcat.txt
            adb pull /sdcard/Android/data/in.guardianregistry.app/files/shots app-screens || true
      - name: Keep the screenshots of every screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screens
          path: app-screens/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check the real Keystore attestation with the registry's parser
        run: python scripts/check_attestation.py attestation-logcat.txt
      - if: failure()
        run: tail -100 server.log || true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trial secrets and certificates
        run: python scripts/deploy_init.py --dev
      - name: Postgres, two API nodes, nginx (TLS + client certificates) and backups
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 240
      - name: Smoke test through nginx
        run: python scripts/smoke_deploy.py https://localhost:8443
      - name: OWASP ZAP baseline scan of the running deployment (passive; warnings are reported, failures fail)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost:8443/app/ -I -r zap-report.html -J zap-report.json
          python - <<'PY'
          import json
          r = json.load(open("zap/zap-report.json"))
          alerts = [a for s in r.get("site", []) for a in s.get("alerts", [])]
          for a in sorted(alerts, key=lambda a: -int(a.get("riskcode", 0))):
              print(f"risk {a['riskcode']}: {a['name']} ({a.get('count', '?')})")
          high = [a for a in alerts if int(a.get("riskcode", 0)) >= 3]
          assert not high, f"{len(high)} high-risk ZAP findings"
          PY
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
          retention-days: 14
      - name: Both API nodes served traffic
        run: |
          for n in api1 api2; do docker compose -f deploy/docker-compose.yml logs $n | grep -q "GET /healthz" || { echo "$n served nothing"; exit 1; }; done
      - name: Back up, restore into a new database, verify the restored audit chain
        run: |
          set -e
          C="docker compose -f deploy/docker-compose.yml"
          $C exec -T backup sh /backup.sh
          DUMP=$($C exec -T backup sh -c 'ls -1 /backups/*.dump | tail -1')
          $C exec -T backup sh /restore.sh "$DUMP" guardian_restored
          URL=$(sed 's#/guardian$#/guardian_restored#' deploy/secrets/db_url)
          $C run --rm -T --no-deps -e GR_DB_FILE= -e GR_DB="$URL" api1 python -c "import os; from guardian_registry.db import Database; from guardian_registry.service import Registry; v=Registry(Database(os.environ['GR_DB'])).verify_audit(); print('restored audit:', v); assert v.ok and v.entries > 0"
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200

  load-test:
    runs-on: ubuntu-latest
    needs: test-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Two nodes on Postgres; concurrent checks; daily limits must hold
        env:
          GR_OPERATORS: "alice:ci-alice-token,bob:ci-bob-token"
          GR_DB: postgresql://postgres:postgres@localhost:5432/postgres
          GR_RATE_BACKEND: db
          GR_RATE_OTP: "100000/60"
          GR_RATE_CHECKS: "10000000/60"
          GR_OTP_DEV_ECHO: "1"
        run: |
          python -m uvicorn guardian_registry.api:create_app --factory --port 8000 > a.log 2>&1 &
          python -m uvicorn guardian_registry.api:create_app --factory --port 8001 > b.log 2>&1 &
          for p in 8000 8001; do for i in $(seq 1 30); do curl -sf http://127.0.0.1:$p/healthz && break; sleep 1; done; done
          python scripts/loadtest.py http://127.0.0.1:8000 http://127.0.0.1:8001 --admin alice:ci-alice-token,bob:ci-bob-token \
            --people 200 --checks 4000 --concurrency 64 --json loadtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest
          path: loadtest.json

  bank-kit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Start a development registry
        run: |
          GR_DB=bank-kit.db python scripts/dev_server.py 8010 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
      - name: Bank conformance run with the Python library (webhooks delivered over HTTP)
        run: python scripts/bank_conformance.py http://127.0.0.1:8010 --admin dev-admin --setup-env live.env
      - name: Java library tests, including the live run against the same registry
        run: |
          set -a; . ./live.env; set +a
          gradle -p sdk/java test --no-daemon
      - if: failure()
        run: tail -100 server.log || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pip-audit==2.7.3 bandit==1.8.0
      - name: Known vulnerabilities in the runtime dependencies
        run: pip-audit -r requirements-runtime.txt --strict
      - name: Static analysis (medium and high findings fail the build)
        run: bandit -r guardian_registry -ll -q
      - name: Authorization matrix
        run: python -m pytest -q tests/test_authz.py
