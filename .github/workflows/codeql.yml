name: CodeQL

# GitHub's code scanning (free for public repositories): finds injection, unsafe
# deserialisation, path traversal and similar bugs in the Python server and the web app.
# Results appear under Security -> Code scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * 1"     # weekly, for newly published queries

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
