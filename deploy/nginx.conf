worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s rid=$request_id';
    access_log /dev/stdout main;

    upstream registry {
        server api1:8000 max_fails=2 fail_timeout=5s;
        server api2:8000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # Banks present client certificates chaining to these CAs; the registry then pins
        # each bank's exact certificate. People's apps don't send one, hence "optional".
        ssl_client_certificate /etc/nginx/certs/bank-cas.pem;
        ssl_verify_client optional;
        ssl_verify_depth 3;

        client_max_body_size 25m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /metrics { return 404; }   # scraped inside the network, never from outside

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            # always overwritten, so a client can't send its own
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_pass http://registry;
        }
    }
}
