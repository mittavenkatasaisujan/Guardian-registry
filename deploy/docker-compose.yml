# A complete registry on one machine: Postgres, two API nodes, nginx terminating TLS and
# checking bank client certificates, and nightly backups.
#
#   python scripts/deploy_init.py          # secrets, certificates and deploy/.env (once)
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl --cacert deploy/certs/ca.pem https://localhost:8443/readyz
#
# The secrets are files under deploy/secrets/, passed to containers as Docker secrets and
# read through GR_*_FILE; they never appear in the environment or in `docker inspect`.

name: guardian-registry

x-api: &api
  build:
    context: ..
  restart: unless-stopped
  env_file: .env
  environment:
    GR_DB_FILE: /run/secrets/db_url
    GR_PEPPER_FILE: /run/secrets/pepper
    GR_DATA_KEY_FILE: /run/secrets/data_key
    GR_OPERATORS_FILE: /run/secrets/operators
    GR_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    GR_TRUSTED_PROXIES: 172.28.0.10          # nginx, below: the only hop allowed to forward client data
    GR_RATE_BACKEND: db                       # one rate limit across both nodes
    GR_LOG_FORMAT: json
  secrets: [db_url, pepper, data_key, operators, metrics_token]
  depends_on:
    db:
      condition: service_healthy
  networks: [internal]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [internal]

  api1:
    <<: *api
  api2:
    <<: *api

  proxy:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["8443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api1, api2]
    networks:
      internal:
        ipv4_address: 172.28.0.10

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: guardian
      PGDATABASE: guardian
      PGPASSFILE: /tmp/pgpass
      BACKUP_KEEP_DAYS: "14"
      BACKUP_EVERY_SECONDS: "86400"
    secrets: [db_password]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do /backup.sh; sleep $$BACKUP_EVERY_SECONDS; done"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  backups:

secrets:
  db_url:
    file: ./secrets/db_url
  db_password:
    file: ./secrets/db_password
  pepper:
    file: ./secrets/pepper
  data_key:
    file: ./secrets/data_key
  operators:
    file: ./secrets/operators
  metrics_token:
    file: ./secrets/metrics_token
